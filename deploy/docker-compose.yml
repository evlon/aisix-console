# Single-container deployment: AISIX gateway + web console in one image.
services:
  aisix:
    image: ghcr.io/evlon/aisix-console:latest
    container_name: aisix
    ports:
      - "3000:3000"   # proxy
      - "3002:3002"   # admin (3001 is used by other tooling on this machine)
      - "9090:9090"   # metrics/status
      - "8787:8787"   # console UI
    volumes:
      - ./aisix-data:/etc/aisix
    restart: unless-stopped
