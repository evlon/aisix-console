# Gateway config for the single-container deployment (mounted at
# /etc/aisix/config.yaml; resources.yaml lives next to it).
resources_file: "/etc/aisix/resources.yaml"

proxy:
  addr: "0.0.0.0:3000"

admin:
  enabled: true
  addr: "0.0.0.0:3002"
  # CHANGE THIS. The value below ships in the repository, so it is public — and
  # this listener is bound to 0.0.0.0 and published on the host. Anyone who can
  # reach :3002 with the shipped key gets the read-only admin surface (model
  # health, resource listings). It is also the value the console's
  # aisix-console.yaml `adminKey` must match; change both together.
  #
  # Do NOT write "${SOME_VAR}" here: config.yaml does not interpolate, so that
  # is a 20-character literal, not a lookup (see deploy/README.md).
  admin_keys:
    - "admin-local-test"

observability:
  metrics:
    prometheus:
      enabled: true
      addr: "0.0.0.0:9090"
