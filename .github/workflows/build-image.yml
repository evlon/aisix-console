# Builds the AISIX gateway and assembles the single-container image
# (gateway + console), pushed to GHCR.
#
# Gateway source (two-track):
#   stable  → api7/aisix LATEST RELEASE, fetched at build time via the
#             GitHub API (includes claim_mappings, which the console
#             writes). The validate gate below rejects gateway-schema
#             drift before any image is pushed, so stable always tracks
#             the newest compatible release. Override with aisix_ref.
#             (evlon/aisix fork is retired — both tracks use api7/aisix.)
#             → :latest / :v*
#   edge    → api7/aisix main (newest features)        → :edge (nightly + dispatch)
#   aisix_ref input overrides the track default.
#
# Triggers:
#   push to main        → ghcr.io/evlon/aisix-console:latest   (stable)
#   push tag v*         → ghcr.io/evlon/aisix-console:v*
#   schedule (nightly)  → ghcr.io/evlon/aisix-console:edge
#   workflow_dispatch   → stable (:latest) or edge (:edge)

name: build + push image (aisix + console)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "stable = api7/aisix latest release; edge = api7/aisix main (newest features)"
        required: false
        default: "stable"
      aisix_ref:
        description: "override gateway ref (commit / tag / branch) — overrides the track default"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  # Nightly: rebuild the edge track from api7/aisix main.
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/evlon/aisix-console
  # Default gateway refs per track.
  #   stable → api7/aisix latest release (fetched at build time). The
  #            validate gate rejects schema drift before push, so it is
  #            safe to always track the newest release. AISIX_STABLE_FALLBACK
  #            is only used if the GitHub API call to find the latest release
  #            fails (transient network / rate-limit). Override with aisix_ref.
  #   edge   → api7/aisix main (newest features).
  AISIX_STABLE_REPO: "api7/aisix"
  AISIX_STABLE_FALLBACK: "v0.9.0"
  AISIX_EDGE_REPO: "api7/aisix"

permissions:
  contents: read
  packages: write

jobs:
  build-gateway:
    name: build aisix (linux x86_64, release)
    runs-on: ubuntu-latest
    # Build inside debian:bookworm so the binary links glibc 2.36 — the same
    # glibc the runtime base `node:22-bookworm-slim` ships. Building on the
    # default ubuntu-latest runner links glibc 2.38/2.39, which the slim
    # runtime lacks, so the gateway fails to exec ("GLIBC_2.38 not found").
    container:
      image: debian:bookworm
    outputs:
      aisix_version: ${{ steps.ver.outputs.version }}
      track: ${{ steps.src.outputs.track }}
    steps:
      - name: install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config \
            protobuf-compiler libssl-dev jq

      - name: resolve gateway source
        id: src
        run: |
          set -eu
          track="${{ inputs.track }}"
          if [ -z "$track" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              track="edge"
            else
              track="stable"
            fi
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
          if [ "$track" = "edge" ]; then
            echo "repo=${{ env.AISIX_EDGE_REPO }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.aisix_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${{ env.AISIX_STABLE_REPO }}" >> "$GITHUB_OUTPUT"
            if [ -n "${{ inputs.aisix_ref }}" ]; then
              ref="${{ inputs.aisix_ref }}"
            else
              # Fetch the latest release tag via the GitHub API. On transient
              # failure / rate-limit, fall back to AISIX_STABLE_FALLBACK.
              ref="${{ env.AISIX_STABLE_FALLBACK }}"
              tag="$(
                curl -fsSL \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${{ github.token }}" \
                  "https://api.github.com/repos/${{ env.AISIX_STABLE_REPO }}/releases/latest" \
                | jq -r '.tag_name // empty' 2>/dev/null || true
              )"
              if [ -n "$tag" ]; then
                ref="$tag"
              else
                echo "::warning::could not fetch latest stable release, using fallback $ref"
              fi
            fi
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.ref }}
          path: aisix

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aisix

      - name: cargo build --release
        working-directory: aisix
        run: cargo build --release -p aisix-server --bin aisix

      - name: set gateway version
        id: ver
        run: |
          set -eu
          tag="${{ steps.src.outputs.ref }}"
          sha=$(git -C aisix rev-parse --short HEAD)
          if [ "${{ steps.src.outputs.track }}" = "edge" ]; then
            echo "version=edge-${sha}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: upload aisix binary
        uses: actions/upload-artifact@v4
        with:
          name: aisix-bin
          path: aisix/target/release/aisix
          if-no-files-found: error

  build-push-image:
    name: build + push image
    needs: build-gateway
    runs-on: ubuntu-latest
    env:
      AISIX_VERSION: ${{ needs.build-gateway.outputs.aisix_version }}
    steps:
      - uses: actions/checkout@v4

      - name: download aisix binary
        uses: actions/download-artifact@v4
        with:
          name: aisix-bin
          path: aisix-bin

      - name: validate gateway resources schema
        # Mirrors the console's own `aisix validate --resources <file>` call
        # (server/src/validate.js). Fails the build on gateway-schema drift
        # vs. what the console writes, before any image is pushed.
        run: |
          chmod +x aisix-bin/aisix
          ./aisix-bin/aisix validate --resources deploy/resources.ci-sample.yaml

      - name: compute image tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tags=${{ env.IMAGE }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/main ]]; then
            echo "tags=${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.build-gateway.outputs.track }}" == "edge" ]]; then
            echo "tags=${{ env.IMAGE }}:edge" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE }}:aisix-${AISIX_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            AISIX_VERSION=${{ env.AISIX_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
