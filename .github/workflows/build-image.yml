# Builds the AISIX gateway and assembles the single-container image
# (gateway + console), pushed to GHCR.
#
# Gateway source (two-track):
#   stable  → api7/aisix at a PINNED ref (AISIX_STABLE_REF), not "latest
#             release". The console writes and validates
#             `_format_version: "2"`, which only a gateway >= 1.11 accepts, so
#             following whatever release is newest can bundle an `aisix` that
#             rejects the console's own files. That happened: while v1.11.0's
#             release was a draft, releases/latest resolved to 1.10.0.
#             The validate gate below still rejects gateway-schema drift
#             before any image is pushed — it caught exactly this when the
#             pin's gateway upgraded past the console's CI sample.
#             Override with aisix_ref.  (evlon/aisix fork is retired — both
#             tracks use api7/aisix.)          → :latest + :aisix-X.Y.Z
#   edge    → api7/aisix main (newest features)        → :edge (dispatch only)
#   aisix_ref input overrides the track default.
#
# Triggers:
#   push to main        → ghcr.io/evlon/aisix-console:latest + :aisix-X.Y.Z  (stable)
#   push tag v*         → ghcr.io/evlon/aisix-console:v*   (console release)
#   schedule (nightly)  → ghcr.io/evlon/aisix-console:latest + :aisix-X.Y.Z  (stable — tracks releases)
#   workflow_dispatch   → stable (:latest + :aisix-X.Y.Z) or edge (:edge)

name: build + push image (aisix + console)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "stable = api7/aisix at the pinned AISIX_STABLE_REF; edge = api7/aisix main (newest features)"
        required: false
        default: "stable"
      aisix_ref:
        description: "override gateway ref (commit / tag / branch) — overrides the track default"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  # Nightly: rebuild the stable track (latest aisix release) so :latest
  # tracks releases — a new aisix release shows up in :latest within ~24h.
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/evlon/aisix-console
  # Default gateway refs per track.
  #   stable → PINNED, deliberately not "latest release". The console now
  #            writes and validates `_format_version: "2"`, which only a
  #            gateway >= 1.11 can read, so tracking whatever release happens
  #            to be newest can produce an image whose bundled `aisix` rejects
  #            the very files the console writes ("unrecognized
  #            _format_version"). That is a silent trap, not a hypothetical:
  #            while v1.11.0's release was still a DRAFT, releases/latest
  #            resolved to 1.10.0. Bump this line when a newer gateway is
  #            wanted; the validate gate below fails the build if the pinned
  #            gateway rejects the console's own CI sample.
  #   edge   → api7/aisix main (newest features).
  AISIX_STABLE_REPO: "api7/aisix"
  AISIX_STABLE_REF: "v1.11.0"
  AISIX_EDGE_REPO: "api7/aisix"

permissions:
  contents: read
  packages: write

jobs:
  build-gateway:
    name: build aisix (linux x86_64, release)
    runs-on: ubuntu-latest
    # Build inside debian:bookworm so the binary links glibc 2.36 — the same
    # glibc the runtime base `node:22-bookworm-slim` ships. Building on the
    # default ubuntu-latest runner links glibc 2.38/2.39, which the slim
    # runtime lacks, so the gateway fails to exec ("GLIBC_2.38 not found").
    container:
      image: debian:bookworm
    outputs:
      aisix_version: ${{ steps.ver.outputs.version }}
      track: ${{ steps.src.outputs.track }}
    steps:
      - name: install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config \
            protobuf-compiler libssl-dev jq

      - name: resolve gateway source
        id: src
        run: |
          set -eu
          track="${{ inputs.track }}"
          if [ -z "$track" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              track="stable"
            else
              track="stable"
            fi
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
          if [ "$track" = "edge" ]; then
            repo="${{ env.AISIX_EDGE_REPO }}"
            ref="${{ inputs.aisix_ref || 'main' }}"
            echo "repo=$repo" >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            repo="${{ env.AISIX_STABLE_REPO }}"
            echo "repo=$repo" >> "$GITHUB_OUTPUT"
            # Pinned, or overridden per run. Deliberately NOT releases/latest:
            # see AISIX_STABLE_REF above.
            ref="${{ inputs.aisix_ref || env.AISIX_STABLE_REF }}"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "::notice::Resolved gateway source → repo=$repo ref=$ref (track=$track)"
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.ref }}
          path: aisix

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aisix

      - name: cargo build --release
        working-directory: aisix
        run: cargo build --release -p aisix-server --bin aisix

      - name: print compiled gateway version
        # Actually execute the freshly built binary so the compiled version is
        # visible in the log (the "see what was built" step).
        working-directory: aisix
        run: ./target/release/aisix --version 2>&1 || ./target/release/aisix version 2>&1 || true

      - name: set gateway version
        id: ver
        run: |
          set -eu
          tag="${{ steps.src.outputs.ref }}"
          trk="${{ steps.src.outputs.track }}"
          sha=$(git -C aisix rev-parse --short HEAD)
          if [ "$trk" = "edge" ]; then
            version="edge-${sha}"
          else
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Compiled AISIX gateway version = $version (track=$trk, ref=$tag, sha=$sha)"

      - name: upload aisix binary
        uses: actions/upload-artifact@v4
        with:
          name: aisix-bin
          path: aisix/target/release/aisix
          if-no-files-found: error

  build-push-image:
    name: build + push image
    needs: build-gateway
    runs-on: ubuntu-latest
    env:
      AISIX_VERSION: ${{ needs.build-gateway.outputs.aisix_version }}
    steps:
      - uses: actions/checkout@v4

      - name: download aisix binary
        uses: actions/download-artifact@v4
        with:
          name: aisix-bin
          path: aisix-bin
        # NOTE: this binary is used ONLY for the schema gate below. It is no
        # longer shipped in the image — the image takes the gateway from the
        # official multi-arch image, so an arm64 build gets an arm64 binary
        # (a prebuilt amd64 artifact copied into an arm64 image would exec-fail,
        # and the console's save path calls `aisix validate`).

      - name: validate gateway resources schema
        # Mirrors the console's own `aisix validate --resources <file>` call
        # (server/src/validate.js). Fails the build on gateway-schema drift
        # vs. what the console writes, before any image is pushed.
        run: |
          chmod +x aisix-bin/aisix
          ./aisix-bin/aisix validate --resources deploy/resources.ci-sample.yaml

      - name: resolve gateway image
        id: gwimg
        # buildx builds each stage for the TARGET platform, so pointing the
        # Dockerfile at the upstream multi-arch image is what yields a correct
        # per-architecture gateway binary without cross-compiling.
        run: |
          set -euo pipefail
          track="${{ needs.build-gateway.outputs.track }}"
          if [ "$track" = "edge" ]; then
            # Upstream publishes main builds as ci-test-<short-sha>.
            ref="ghcr.io/api7/aisix:ci-test-${AISIX_VERSION#edge-}"
          else
            ref="ghcr.io/api7/aisix:${AISIX_VERSION}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice::gateway image for this build: $ref"

      - name: compute image tag
        id: meta
        run: |
          set -euo pipefail
          track="${{ needs.build-gateway.outputs.track }}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            # Console release: tag the image with the console version.
            echo "tags=${{ env.IMAGE }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "$track" == "edge" ]]; then
            echo "tags=${{ env.IMAGE }}:edge" >> "$GITHUB_OUTPUT"
          else
            # Stable track (latest aisix release): always refresh :latest and
            # also pin the exact gateway version so a release is reproducible
            # (e.g. ghcr.io/evlon/aisix-console:aisix-0.10.0).
            echo "tags=${{ env.IMAGE }}:latest,${{ env.IMAGE }}:aisix-${AISIX_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/arm64 matters for 信创 / Kunpeng-class hosts, which are common
          # enough that an amd64-only console is a deployment blocker there.
          # The arm64 leg runs `npm ci` under emulation; the deps are pure JS,
          # so it works, it is just slower.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AISIX_VERSION=${{ env.AISIX_VERSION }}
            AISIX_GATEWAY_IMAGE=${{ steps.gwimg.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: summarize build
        if: always()
        run: |
          {
            echo "### AISIX gateway image build"
            echo "- track: ${{ needs.build-gateway.outputs.track }}"
            echo "- aisix.version: ${{ env.AISIX_VERSION }}"
            echo "- image tags: ${{ steps.meta.outputs.tags }}"
            echo "- resolved gateway ref: ${{ needs.build-gateway.outputs.track == 'edge' && 'api7/aisix@main' || 'api7/aisix at the pinned stable ref' }}"
          } >> "$GITHUB_STEP_SUMMARY"
