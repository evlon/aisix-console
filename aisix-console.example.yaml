# AISIX Console 配置示例 —— 复制为 aisix-console.yaml 后修改

# 控制台监听地址（个人使用默认仅本机）
port: 8787
bind: "127.0.0.1"

# 网关的 resources.yaml 路径（文件模式）
resourcesFile: "../aisix/resources.yaml"

# aisix 二进制路径（用于 `aisix validate --resources` 校验）
aisixBin: "../aisix/target/debug/aisix"

# 调用方 key_env 引用模式的明文存放处（gitignore 掉）。
# Provider Key 已改为明文直写 resources.yaml，不再依赖 secrets.env。
secretsFile: "./secrets.env"

# 登录认证文件（密码哈希 + 会话密钥）。首次启动自动创建，默认密码 aisix，
# 登录后可在「设置」修改；也可用 CONSOLE_DEFAULT_PASSWORD 覆盖首次密码。
authFile: "./auth.json"

# 试玩请求超时（毫秒），防止上游挂起时界面一直「发送中」
playgroundTimeoutMs: 180000

gateway:
  proxy: "http://127.0.0.1:3000"     # 代理监听（试玩页转发目标）
  admin: "http://127.0.0.1:3002"     # Admin 监听（读状态用）
  metrics: "http://127.0.0.1:9090"   # Metrics/status 监听（状态看板）
  adminKey: ""                       # 可选：admin_keys 中的某个 key，用于 /admin/v1/health

# 保存成功后执行的重载命令。为空 = 手动重启/重载网关。
# 单容器部署（推荐）：
#   reloadCommand: "kill -HUP $(cat /run/aisix.pid)"
# 其他：
#   Docker (Linux):   docker kill -s HUP aisix
#   systemd:          systemctl reload aisix
#   Linux 原生:        kill -HUP <pid>
#   Windows 原生:      无 SIGHUP，留空，改配置后需重启网关
reloadCommand: ""
